[project]
name = "job-search-mcp"
version = "0.1.0"
description = "MCP server and human-in-the-loop triage agent for a job search kept in an Obsidian vault"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sshower111" }]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jobsearch-mcp = "jobsearch.server:main"
jobagent = "jobsearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S310"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
